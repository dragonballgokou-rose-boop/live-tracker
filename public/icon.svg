<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 背景：シングルのアイスブルー系グラデーション -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF2FF"/>
      <stop offset="60%" stop-color="#F5EAFF"/>
      <stop offset="100%" stop-color="#E8D5F5"/>
    </linearGradient>
    <!-- 三角形グラデーション：アプリのプライマリグラデーションに合わせる -->
    <linearGradient id="triGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <!-- バッジグラデーション -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <!-- 三角形のドロップシャドウ -->
    <filter id="triShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#8B5CF6" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#EC4899" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 背景 (角丸) -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- 薄い外枠 -->
  <rect width="504" height="504" x="4" y="4" rx="107" fill="none"
        stroke="#C8A0DC" stroke-width="1.5" opacity="0.5"/>

  <!--
    公式乃木坂46マーク: 直角三角形
    直角 = 右下
    頂点: 右上(tip), 左下, 右下(直角)
    垂直辺:右, 水平辺:下, 斜辺:左上→左下
  -->
  <polygon
    points="385,108  127,362  385,362"
    fill="url(#triGrad)"
    filter="url(#triShadow)"
  />

  <!-- "LIVE" 小バッジ (右上コーナー) -->
  <rect x="330" y="58" width="72" height="22" rx="11" fill="url(#badgeGrad)" opacity="0.92"/>
  <text x="366" y="69"
        font-family="Arial, sans-serif"
        font-size="10"
        font-weight="700"
        fill="white"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="3">LIVE</text>
</svg>
