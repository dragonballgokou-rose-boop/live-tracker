name: Update Official Member Feeds

on:
  schedule:
    # 毎日 06:20 JST (= 21:20 UTC) members scraper の後
    - cron: '20 21 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - '.github/workflows/update-official-member-feeds.yml'
      - 'scripts/scrape-member-feeds.mjs'

permissions:
  contents: write
  # scraper commit 後に deploy.yml を workflow_dispatch で起動するため
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # diff 送信のため HEAD~1 が必要
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (web-push + supabase)
        run: npm install --no-audit --no-fund

      - name: Run member feeds scraper
        run: node scripts/scrape-member-feeds.mjs

      - name: Commit updated JSON if changed
        id: commit
        run: |
          git add public/official-member-feeds.json
          if git diff --cached --quiet -- public/official-member-feeds.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update official member feeds (auto)"
          git push origin HEAD:${{ github.ref_name }}

      # 差分があり main ブランチに対する実行のときのみ push 通知を送る
      - name: Send Web Push for new blog / schedule
        if: steps.commit.outputs.changed == 'true' && github.ref_name == 'main'
        env:
          VAPID_PUBLIC_KEY:   ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY:  ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:      ${{ secrets.VAPID_SUBJECT }}
          # 既存の同期用 Secret を再利用 (RLS allow-all なので anon key で十分)
          SUPABASE_URL:       ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY:  ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          APP_URL:            ${{ secrets.APP_URL }}
        run: node scripts/send-push-notifications.mjs --feeds-diff

      # GITHUB_TOKEN で push した commit は Pages deploy を trigger しないので
      # workflow_dispatch で明示的に起動して最新 JSON を配信する
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "deploy dispatch triggered"
