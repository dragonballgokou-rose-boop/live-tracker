name: Update Official Lives

on:
  schedule:
    # 毎日 06:00 JST (= 21:00 UTC)
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        run: node scripts/scrape-official.mjs

      - name: Commit updated JSON if changed
        run: |
          if git diff --quiet -- public/official-lives.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/official-lives.json
          git commit -m "chore: update official lives (auto)"
          git push
