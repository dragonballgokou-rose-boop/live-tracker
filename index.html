<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f23" />
  <meta name="description" content="ライブ参戦集計表 - チームでライブの参戦状況を管理・集計" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="N46 LIVE" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <title>乃木坂46 LIVE TRACKER</title>
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <!-- SVG filter defs — liquid glass filters -->
  <!-- #liquid-glass-nav and #liquid-glass-indicator are injected by js/liquidGlass.js -->
  <svg style="width:0;height:0;position:absolute" aria-hidden="true"
       color-interpolation-filters="sRGB">
    <defs id="svg-defs">
      <!-- Blob distortion: organic turbulence for the nav-blob colour source -->
      <filter id="glass-distort" x="-15%" y="-15%" width="130%" height="130%">
        <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009"
                      numOctaves="4" seed="8" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise"
                           scale="14" xChannelSelector="R" yChannelSelector="G"/>
      </filter>

      <!-- Shared liquid backdrop filter — size-agnostic turbulence wobble + saturation boost.
           Used by large surfaces (modal, sheets) as backdrop-filter: url(#liquid-backdrop) -->
      <filter id="liquid-backdrop" x="-4%" y="-4%" width="108%" height="108%"
              color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blurred"/>
        <feColorMatrix in="blurred" type="saturate" values="2.1" result="saturated"/>
        <feComponentTransfer in="saturated" result="brighter">
          <feFuncR type="linear" slope="1.08"/>
          <feFuncG type="linear" slope="1.08"/>
          <feFuncB type="linear" slope="1.08"/>
        </feComponentTransfer>
        <feTurbulence type="fractalNoise" baseFrequency="0.012"
                      numOctaves="2" seed="5" result="wobble"/>
        <feDisplacementMap in="brighter" in2="wobble"
                           scale="6" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <!-- Ambient colour sources — picked up by all liquid-glass surfaces via backdrop-filter -->
  <div class="liquid-bg-source" aria-hidden="true"></div>

  <div id="app">
    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <header class="main-header">
        <div class="header-logo">
          <img src="icon.svg" class="logo-icon-img" alt="" width="34" height="34" />
          <span class="header-logo-text">LIVE<span class="logo-accent">TRACKER</span></span>
        </div>
        <h1 id="page-title" class="page-title">ダッシュボード</h1>
        <div class="header-actions">
          <button id="share-btn" class="header-action-btn" title="リンクを共有">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
          </button>
          <button id="export-btn" class="header-action-btn" title="データをエクスポート">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </button>
          <button id="import-btn" class="header-action-btn" title="データをインポート">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
          </button>
          <input type="file" id="import-file" accept=".json" style="display:none" />
          <div id="sync-indicator" class="sync-indicator hidden">
            <svg class="sync-icon animate-spin" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
              <polyline points="21 3 21 8 16 8"></polyline>
            </svg>
            <span class="sync-text">同期中...</span>
          </div>
        </div>
        <div id="top-progress-bar" aria-hidden="true"><div id="top-progress-fill"></div></div>
      </header>
      <div id="page-content" class="page-content">
        <!-- ページ内容がここに動的に挿入される -->
      </div>
    </main>

    <!-- Liquid Glass blob — color source visible through nav glass -->
    <div class="nav-blob" aria-hidden="true"></div>

    <!-- Bottom Navigation (injected by BottomTabBar component) -->
    <div id="bottom-nav-container"></div>
  </div>

  <!-- App Initial Loader -->
  <div id="app-loader" class="app-loader hidden">
    <div class="loader-spinner"></div>
    <div class="loader-text">データを読み込んでいます...</div>
  </div>

  <!-- Modal Container -->
  <div id="modal-container" class="modal-container hidden">
    <div class="modal-backdrop"></div>
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title"></h2>
        <button id="modal-close" class="modal-close-btn" aria-label="閉じる">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/main.js"></script>
</body>

</html>
